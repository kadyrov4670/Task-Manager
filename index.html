<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Habit Tracker</title>
  <meta name="description" content="Weekly habit tracking app" />
  <meta name="theme-color" content="#1D9E75" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --green: #1D9E75; --amber: #EF9F27; --red: #E24B4A;
      --bg: #f5f5f0; --card: #ffffff; --text: #1a1a18;
      --muted: #6b6b66; --border: rgba(0,0,0,0.1); --radius: 12px;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #1a1a18; --card: #2a2a28; --text: #f0efe8; --muted: #9a9a94; --border: rgba(255,255,255,0.1); }
    }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; padding-bottom: 2rem; }
    header { background: var(--green); color: white; padding: 1rem 1.25rem 0.875rem; position: sticky; top: 0; z-index: 10; }
    header h1 { font-size: 20px; font-weight: 600; }
    header p { font-size: 13px; opacity: 0.85; margin-top: 2px; }
    .container { padding: 1rem; max-width: 480px; margin: 0 auto; }
    .week-nav { display: flex; align-items: center; gap: 8px; margin-bottom: 1rem; background: var(--card); border-radius: var(--radius); padding: 0.6rem 0.75rem; border: 1px solid var(--border); }
    .week-nav button { background: none; border: 1px solid var(--border); border-radius: 8px; width: 32px; height: 32px; font-size: 16px; cursor: pointer; color: var(--text); display: flex; align-items: center; justify-content: center; }
    .week-nav button:disabled { opacity: 0.3; cursor: default; }
    .week-label { flex: 1; text-align: center; font-size: 13px; color: var(--muted); font-weight: 500; }
    .add-bar { display: flex; gap: 8px; margin-bottom: 1rem; }
    .add-bar input { flex: 1; padding: 0.65rem 0.875rem; border-radius: 10px; border: 1px solid var(--border); background: var(--card); color: var(--text); font-size: 14px; outline: none; }
    .add-bar input:focus { border-color: var(--green); }
    .add-bar button { background: var(--green); color: white; border: none; border-radius: 10px; padding: 0 1rem; font-size: 22px; cursor: pointer; }
    .habit-card { background: var(--card); border-radius: var(--radius); border: 1px solid var(--border); margin-bottom: 0.75rem; overflow: hidden; }
    .habit-header { display: flex; align-items: center; padding: 0.75rem 0.875rem 0.5rem; gap: 8px; }
    .habit-name { flex: 1; font-size: 15px; font-weight: 500; }
    .del-btn { background: none; border: none; font-size: 16px; cursor: pointer; color: var(--muted); padding: 4px; border-radius: 6px; }
    .del-btn:hover { color: var(--red); }
    .days-row { display: grid; grid-template-columns: repeat(7, 1fr); padding: 0 0.875rem 0.5rem; gap: 4px; }
    .day-cell { text-align: center; }
    .day-label { font-size: 10px; color: var(--muted); margin-bottom: 4px; font-weight: 500; }
    .day-label.today { color: var(--green); font-weight: 700; }
    .tick-btn {
      width: 34px; height: 34px; border-radius: 50%; border: 2px solid var(--border);
      background: var(--bg); cursor: pointer; font-size: 15px;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto; transition: all 0.15s; color: transparent; position: relative;
    }
    .tick-btn.done { background: var(--green); border-color: var(--green); color: white; }
    .tick-btn:disabled { opacity: 0.3; cursor: default; }
    /* Past days: locked style */
    .tick-btn.locked { opacity: 0.5; cursor: not-allowed; background: var(--bg); }
    .tick-btn.locked.done { opacity: 0.65; background: var(--green); border-color: var(--green); color: white; }
    .tick-btn.locked:not(.done)::after { content: '🔒'; font-size: 9px; position: absolute; bottom: -4px; right: -4px; line-height: 1; }
    .progress-row { display: flex; align-items: center; gap: 8px; padding: 0.25rem 0.875rem 0.6rem; }
    .prog-bar-bg { flex: 1; height: 5px; background: var(--border); border-radius: 3px; overflow: hidden; }
    .prog-bar-fill { height: 100%; border-radius: 3px; transition: width 0.3s; }
    .prog-pct { font-size: 12px; font-weight: 600; min-width: 32px; text-align: right; }
    .legend { display: flex; gap: 10px; font-size: 10px; color: var(--muted); padding: 0 0.875rem 0.7rem; }
    .stats-section { background: var(--card); border-radius: var(--radius); border: 1px solid var(--border); padding: 1rem; margin-top: 0.25rem; }
    .stats-title { font-size: 14px; font-weight: 600; margin-bottom: 0.75rem; }
    .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .stat-box { background: var(--bg); border-radius: 10px; padding: 0.75rem; }
    .stat-lbl { font-size: 11px; color: var(--muted); margin-bottom: 4px; }
    .stat-val { font-size: 24px; font-weight: 600; }
    .stat-sub { font-size: 12px; margin-top: 2px; }
    .up { color: var(--green); } .down { color: var(--red); } .neutral { color: var(--muted); }
    .empty { text-align: center; color: var(--muted); font-size: 14px; padding: 2.5rem 1rem; }
    .empty span { font-size: 36px; display: block; margin-bottom: 0.5rem; }
    .toast { position: fixed; bottom: 1.5rem; left: 50%; transform: translateX(-50%); background: #222; color: #fff; padding: 0.5rem 1.1rem; border-radius: 20px; font-size: 13px; opacity: 0; pointer-events: none; transition: opacity 0.25s; z-index: 100; white-space: nowrap; }
    .toast.show { opacity: 1; }
  </style>
</head>
<body>
<header>
  <h1>✅ Habit Tracker</h1>
  <p id="headerDate"></p>
</header>
<div class="container">
  <div class="add-bar">
    <input id="newHabit" type="text" placeholder="Add new habit..." maxlength="40" />
    <button onclick="addHabit()">+</button>
  </div>
  <div class="week-nav">
    <button id="prevBtn" onclick="changeWeek(-1)">&#8249;</button>
    <span class="week-label" id="weekLabel"></span>
    <button id="nextBtn" onclick="changeWeek(1)">&#8250;</button>
  </div>
  <div id="habitList"></div>
  <div class="stats-section">
    <div class="stats-title">📊 Weekly Stats</div>
    <div class="stats-grid" id="statsGrid"></div>
  </div>
</div>
<div class="toast" id="toast"></div>
<script>
  const DAYS = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  const DAYS_FULL = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
  let habits = JSON.parse(localStorage.getItem('ht_habits') || '["Read","Exercise","Drink water"]');
  let checks = JSON.parse(localStorage.getItem('ht_checks') || '{}');
  let weekOffset = 0;

  function save() {
    localStorage.setItem('ht_habits', JSON.stringify(habits));
    localStorage.setItem('ht_checks', JSON.stringify(checks));
  }

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2200);
  }

  function getMonday(offset) {
    const now = new Date();
    const day = now.getDay();
    const diff = day === 0 ? -6 : 1 - day;
    const mon = new Date(now);
    mon.setDate(now.getDate() + diff + offset * 7);
    mon.setHours(0, 0, 0, 0);
    return mon;
  }

  function getDates() {
    const start = getMonday(weekOffset);
    return Array.from({ length: 7 }, (_, i) => {
      const d = new Date(start); d.setDate(start.getDate() + i); return d;
    });
  }

  function fmt(d) { return d.toISOString().slice(0, 10); }
  function fmtShort(d) { return d.getDate() + '.' + String(d.getMonth()+1).padStart(2,'0'); }
  function isChecked(h, dateStr) { return !!checks[h + '||' + dateStr]; }

  function toggle(h, dateStr, locked) {
    if (locked) { showToast('🔒 Past days are locked — stay consistent!'); return; }
    const k = h + '||' + dateStr;
    checks[k] = !checks[k];
    save(); render();
  }

  function addHabit() {
    const inp = document.getElementById('newHabit');
    const val = inp.value.trim();
    if (!val || habits.includes(val)) return;
    habits.push(val); inp.value = ''; save(); render();
  }

  function removeHabit(h) {
    if (!confirm('Remove "' + h + '"?')) return;
    habits = habits.filter(x => x !== h); save(); render();
  }

  function getPct(h, dates) {
    const done = dates.filter(d => isChecked(h, fmt(d))).length;
    return dates.length ? Math.round(done / dates.length * 100) : 0;
  }

  function getOverall(dates) {
    if (!habits.length) return 0;
    const total = habits.length * dates.length;
    const done = habits.reduce((s, h) => s + dates.filter(d => isChecked(h, fmt(d))).length, 0);
    return total ? Math.round(done / total * 100) : 0;
  }

  function render() {
    const today = new Date(); today.setHours(0,0,0,0);
    const dates = getDates();
    const prevDates = (() => {
      const s = getMonday(weekOffset - 1);
      return Array.from({length:7},(_,i)=>{ const d=new Date(s); d.setDate(s.getDate()+i); return d; });
    })();

    document.getElementById('headerDate').textContent = new Date().toLocaleDateString('en-US', { weekday:'long', day:'numeric', month:'long' });
    document.getElementById('weekLabel').textContent = fmtShort(dates[0]) + ' – ' + fmtShort(dates[6]) + (weekOffset === 0 ? ' (This week)' : '');
    document.getElementById('nextBtn').disabled = weekOffset === 0;

    const list = document.getElementById('habitList');
    if (!habits.length) {
      list.innerHTML = '<div class="empty"><span>🌱</span>No habits yet.<br>Add your first habit above!</div>';
    } else {
      list.innerHTML = habits.map(h => {
        const pct = getPct(h, dates);
        const barColor = pct >= 70 ? 'var(--green)' : pct >= 40 ? 'var(--amber)' : 'var(--red)';
        const pctColor = pct >= 70 ? 'up' : pct >= 40 ? '' : 'down';

        const daysHTML = dates.map((d, i) => {
          const dateStr = fmt(d);
          const done = isChecked(h, dateStr);
          const isFuture = d > today && weekOffset === 0;
          const isPast = (d < today) || weekOffset < 0;
          const isToday = d.getTime() === today.getTime();
          let cls = 'tick-btn';
          if (done) cls += ' done';
          if (isPast && !isToday) cls += ' locked';
          const locked = isPast && !isToday;
          return '<div class="day-cell">' +
            '<div class="day-label' + (isToday ? ' today' : '') + '">' + DAYS[i] + '</div>' +
            '<button class="' + cls + '"' +
            (isFuture ? ' disabled' : '') +
            ' onclick="toggle(\'' + h.replace(/'/g,"\\'") + '\',\'' + dateStr + '\',' + locked + ')"' +
            ' title="' + (locked ? 'Past day — locked' : DAYS_FULL[i]) + '">' +
            (done ? '✓' : '') + '</button></div>';
        }).join('');

        return '<div class="habit-card">' +
          '<div class="habit-header"><span class="habit-name">' + h + '</span>' +
          '<button class="del-btn" onclick="removeHabit(\'' + h.replace(/'/g,"\\'") + '\')">🗑</button></div>' +
          '<div class="days-row">' + daysHTML + '</div>' +
          '<div class="progress-row"><div class="prog-bar-bg"><div class="prog-bar-fill" style="width:' + pct + '%;background:' + barColor + '"></div></div>' +
          '<span class="prog-pct ' + pctColor + '" style="color:' + barColor + '">' + pct + '%</span></div>' +
          '<div class="legend"><span>✓ Done</span><span>🔒 Past (locked)</span><span style="opacity:0.5">○ Future</span></div>' +
          '</div>';
      }).join('');
    }

    const curr = getOverall(dates), prev = getOverall(prevDates), diff = curr - prev;
    const best = habits.reduce((b,h)=>{ const p=getPct(h,dates); return p>b.p?{h,p}:b; },{h:'—',p:0});
    const totalDone = habits.reduce((s,h)=>s+dates.filter(d=>isChecked(h,fmt(d))).length,0);
    const diffIcon = diff>0?'↑':diff<0?'↓':'→';
    const diffCls = diff>0?'up':diff<0?'down':'neutral';

    document.getElementById('statsGrid').innerHTML =
      '<div class="stat-box"><div class="stat-lbl">Overall completion</div><div class="stat-val">' + curr + '%</div><div class="stat-sub ' + diffCls + '">' + diffIcon + ' Last week: ' + prev + '%</div></div>' +
      '<div class="stat-box"><div class="stat-lbl">Total completed</div><div class="stat-val">' + totalDone + '</div><div class="stat-sub neutral">' + habits.length + ' habits × 7 days</div></div>' +
      '<div class="stat-box"><div class="stat-lbl">Best habit</div><div class="stat-val" style="font-size:15px;margin-top:6px">' + best.h + '</div><div class="stat-sub up">' + (best.p>0?best.p+'%':'') + '</div></div>' +
      '<div class="stat-box"><div class="stat-lbl">Change</div><div class="stat-val ' + diffCls + '">' + (diff>0?'+':'') + diff + '%</div><div class="stat-sub neutral">vs last week</div></div>';
  }

  function changeWeek(dir) {
    const next = weekOffset + dir;
    if (next > 0) return;
    weekOffset = next; render();
  }

  document.getElementById('newHabit').addEventListener('keydown', e => { if (e.key==='Enter') addHabit(); });

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  }

  render();
</script>
</body>
</html>
